<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#294C3A">
  <meta name="description" content="The Macca Family Cookbook — simple meals, homemade, family tested.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>The Macca Family Cookbook</title>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="logo">🍞</div>
      <p class="eyebrow">Version 1.0 · The Beginning</p>
      <h1>The Macca Family Cookbook</h1>
      <p class="tagline">Simple meals. Homemade. Family tested.</p>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search recipes, ingredients or tags…" aria-label="Search recipes">
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Recipe filters">
      <button class="filter active" data-category="All">All</button>
      <button class="filter" data-category="Breakfast">Breakfast</button>
      <button class="filter" data-category="Beef">Beef</button>
      <button class="filter" data-category="Chicken">Chicken</button>
      <button class="filter" data-category="Seafood">Seafood</button>
      <button class="filter" data-category="Bread & Baking">Bread</button>
      <button class="filter" data-category="Slow Cooker">Slow Cooker</button>
    </section>

    <section class="section-head">
      <div>
        <p class="eyebrow dark">Your collection</p>
        <h2>Recipes</h2>
      </div>
      <span id="count" class="count"></span>
    </section>

    <section id="recipe-grid" class="recipe-grid" aria-live="polite"></section>
  </main>

  <dialog id="recipe-dialog">
    <button id="close-dialog" class="close" aria-label="Close recipe">×</button>
    <article id="recipe-detail"></article>
  </dialog>

  <footer>
    <p>Made for the Macca family ❤️</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
